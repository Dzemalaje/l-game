<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>L Game · SpacetimeDB</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e7eaf0;
        --dim: #8b93a5;
        --own: #4f8cff;
        --foe: #ff6b5e;
        --disc: #f0c65a;
        --ok: #4ec98a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        padding: 24px 16px 48px;
      }
      main { width: 100%; max-width: 420px; }
      header {
        display: flex; align-items: baseline; justify-content: space-between;
        margin-bottom: 4px;
      }
      h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 20px 0 8px; }
      #status { font-size: 12px; }
      #status.ok { color: var(--ok); }
      #status.warn { color: var(--disc); }
      #meta { color: var(--dim); font-size: 13px; margin-bottom: 16px; }

      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

      #seats { display: grid; gap: 6px; margin-bottom: 12px; }
      .seat {
        display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center;
        padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
      }
      .seat.active { border-color: var(--own); }
      .seat .who { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
      .seat.you .who { color: var(--own); }
      .seat .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .seat .time { font-variant-numeric: tabular-nums; font-weight: 600; }

      .board {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
        aspect-ratio: 1; margin-bottom: 14px;
      }
      .sq {
        border: 1px solid var(--line); border-radius: 10px; background: #12151c;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; color: rgba(255,255,255,.55);
        transition: background .12s, border-color .12s, transform .12s;
      }
      .board.live .sq { cursor: pointer; }
      .sq.own { background: var(--own); border-color: var(--own); }
      .sq.foe { background: var(--foe); border-color: var(--foe); }
      .sq.disc { background: var(--disc); border-color: var(--disc); }
      .sq.drawn { background: #2f6de0; border-color: #7fb0ff; transform: scale(1.03); }
      .sq.hint { border-color: var(--own); box-shadow: inset 0 0 0 2px rgba(79,140,255,.25); }
      .sq.target { box-shadow: inset 0 0 0 2px rgba(240,198,90,.5); }
      .sq.picked { outline: 2px solid #fff; outline-offset: -2px; }
      .sq.dest { background: var(--disc); border-color: #fff; }
      .sq.remote { box-shadow: inset 0 0 0 2px rgba(255,107,94,.55); }
      .board.idle .sq { opacity: .35; }

      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        flex: 1; min-width: 110px; padding: 10px 14px; border-radius: 10px;
        border: 1px solid var(--line); background: #1d212a; color: var(--text);
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: #3a4152; }
      button.primary { background: var(--own); border-color: var(--own); color: #06101f; }
      button.danger { background: transparent; color: var(--foe); border-color: #40252a; flex: 0 0 auto; min-width: 90px; }
      button:disabled { opacity: .4; cursor: not-allowed; }

      .hint-text { color: var(--dim); font-size: 13px; margin: 0 0 10px; }
      .result { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
      .result strong { font-size: 20px; }
      .result.won strong { color: var(--ok); }
      .result.lost strong { color: var(--foe); }
      .result span { color: var(--dim); font-size: 13px; }

      .lead { display: grid; grid-template-columns: 24px 1fr auto auto; gap: 10px; padding: 5px 0; font-size: 13px; border-top: 1px solid var(--line); }
      .lead span:first-child { color: var(--dim); }
      .lead span:nth-child(3) { font-variant-numeric: tabular-nums; font-weight: 600; }
      .lead span:last-child { color: var(--dim); }

      #rename { display: flex; gap: 8px; margin-top: 8px; }
      input {
        flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
        background: #12151c; color: var(--text); font: inherit;
      }
      #rename button { flex: 0 0 auto; min-width: 84px; }

      #notice {
        display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px;
        background: #2a1d1f; border: 1px solid #48292d; color: #ffb4ac; font-size: 13px;
      }
      footer { color: var(--dim); font-size: 12px; margin-top: 20px; }
      code { background: #12151c; padding: 1px 5px; border-radius: 5px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>L Game</h1>
        <span id="status" class="warn">connecting…</span>
      </header>
      <div id="meta"></div>

      <div id="seats"></div>
      <div id="board"></div>
      <div id="controls"></div>

      <div id="lobby">
        <div id="queue"></div>
        <div id="rename">
          <input id="name" placeholder="your name" maxlength="20" autocomplete="off" />
          <button data-act="rename">Set name</button>
        </div>
        <div id="leaders"></div>
      </div>

      <div id="notice"></div>

      <footer>
        Open this page in a second tab to play against yourself — each tab is its own player.
        Backend: <code>ws://127.0.0.1:3000</code> · <code>l-game</code>
      </footer>
    </main>
    <script type="module" src="./bundle.js"></script>
  </body>
</html>
